{% load static %}

<link rel="stylesheet" href="{% static 'css/forms.css' %}">

<div class="login-page">

    <!-- 왼쪽 로그인 영역 -->
    <div class="login-section">

        <div class="login-logo">
            CHOEZY
        </div>

        <div class="login-box">

            <h1>로그인</h1>
            <p class="login-subtitle">
                CHOEZY에 오신 것을 환영해요!
            </p>


            <form method="POST">

                {% csrf_token %}

                <!-- 이메일 -->
                <div class="input-box">
                    <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail-icon lucide-mail"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></span>

                    <input 
                        type="email"
                        name="email"
                        placeholder="이메일 주소"
                    >
                </div>


                <!-- 비밀번호 -->
                <div class="input-box">

                    <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-icon lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>

                    <input 
                        id="password"
                        type="password"
                        name="password"
                        placeholder="비밀번호"
                    >

                    <button 
                        type="button"
                        id="password-toggle"
                        class="eye-btn">
                        👁
                    </button>

                </div>


                <div class="login-option">

                    <label>
                        <input type="checkbox">
                        로그인 상태 유지
                    </label>

                    <a href="#">
                        비밀번호 찾기
                    </a>

                </div>


                <button class="login-btn">
                    로그인
                </button>


            </form>


            <div class="divider">
                또는
            </div>


            <button class="social-btn google">
                <span class="social-icon">
                    <img src="{% static 'images/googlelogo.png' %}">
                </span>
                Google로 로그인
            </button>


            <button class="social-btn kakao">
                <span class="social-icon">
                    <img src="{% static 'images/kakaologo.png' %}">
                </span>
                카카오로 로그인
            </button>



            <p class="signup-text">

                아직 계정이 없으신가요?

                <a href="{% url 'accounts:signup' %}">
                    회원가입
                </a>

            </p>


        </div>

    </div>



    <!-- 오른쪽 소개 영역 -->

    <div class="intro-section">


        <img 
            src="{% static 'images/login_character.png' %}"
            class="login-character"
        >


        <h2>
            더 똑똑한 소비를 위한<br>
            AI 구매 의사결정 지원 서비스
        </h2>



        <div class="intro-logo">
            <img 
                src="{% static 'images/intrologo.png' %}"
                class="intrologo"
            >
        </div>



        <div class="feature-list">


            <div class="feature-item">

                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-no-axes-combined-icon lucide-chart-no-axes-combined"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></svg>
                </div>

                <div>
                    <h3>
                        객관적인 비교 분석
                    </h3>

                    <p>
                        다양한 대안을 한눈에 비교
                    </p>
                </div>

            </div>



            <div class="feature-item">

                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bot-icon lucide-bot"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                </div>

                <div>
                    <h3>
                        AI 기반 인사이트
                    </h3>

                    <p>
                        당신의 상황에 맞는 추천
                    </p>
                </div>

            </div>




            <div class="feature-item">

                <div class="feature-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-dollar-sign-icon lucide-circle-dollar-sign"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                </div>

                <div>
                    <h3>
                        현명한 소비 습관
                    </h3>

                    <p>
                        더 만족스러운 선택을 위해
                    </p>
                </div>

            </div>


        </div>


    </div>


</div>


<script src="{% static 'js/auth.js' %}"></script>
