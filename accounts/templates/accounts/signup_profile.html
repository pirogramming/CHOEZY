{% load static %}

<link rel="stylesheet" href="{% static 'css/forms.css' %}">


<div class="signup-page">


    <!-- 로고 -->
    <div class="signup-logo">
        CHOEZY
    </div>



    <!-- 상단 영역 -->
    <div class="signup-top">


        <div class="signup-top-left">


            <div class="signup-title-area">

                <h1>
                    소비 프로필을 설정해주세요
                </h1>

                <p>
                    더 정확한 추천과 분석을 위해 필요해요.
                </p>

            </div>



            <img src="{% static 'images/signup_character.png' %}" class="signup-character" alt="signup character">


        </div>



        <div class="signup-top-right">


            <div class="signup-step">


                <div class="step-item active">

                    <div class="step-circle">
                        1
                    </div>


                    <span class="step-text">
                        기본 정보 입력
                    </span>

                </div>



                <div class="step-item-line">

                    <div class="step-line"></div>

                </div>



                <div class="step-item active">

                    <div class="step-circle">
                        2
                    </div>


                    <span class="step-text">
                        소비 프로필 설정
                    </span>

                </div>


            </div>


        </div>


    </div>





    <form method="POST" id="profile-form">

        {% csrf_token %}



        <div class="profile-form-container">



            <!-- ================= 소비성향 ================= -->


            <section class="profile-section">


                <div class="profile-section-title">

                    <span>
                        1
                    </span>


                    <h2>
                        소비성향
                        <small>
                            (최대 2개 선택 가능)
                        </small>
                    </h2>

                </div>




                <div class="profile-option-grid">



                    <label class="profile-option">


                        <input type="checkbox" name="consumption_type" value="value">



                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z" />

                                <path d="M16 10h.01" />

                                <path d="M2 8v1a2 2 0 0 0 2 2h1" />

                            </svg>


                            <span>
                                가성비 중심
                            </span>


                        </div>


                    </label>





                    <label class="profile-option">


                        <input type="checkbox" name="consumption_type" value="quality">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />

                                <path d="M20 2v4" />

                                <path d="M22 4h-4" />

                                <circle cx="4" cy="20" r="2" />

                            </svg>


                            <span>
                                품질 중심
                            </span>


                        </div>


                    </label>





                    <label class="profile-option">


                        <input type="checkbox" name="consumption_type" value="experience">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />

                            </svg>


                            <span>
                                경험/만족 중심
                            </span>


                        </div>


                    </label>



                    <label class="profile-option">

                        <input type="checkbox" name="consumption_type" value="growth">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" />

                                <path
                                    d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" />

                            </svg>


                            <span>
                                자기계발 중심
                            </span>


                        </div>


                    </label>

                    <!-- 소비성향 나머지 -->

                    <label class="profile-option">

                        <input type="checkbox" name="consumption_type" value="asset">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path d="M3 3v16a2 2 0 0 0 2 2h16" />

                                <path d="M7 16c.5-2 1.5-7 4-7 2 0 2 3 4 3 2.5 0 4.5-5 5-7" />

                            </svg>


                            <span>
                                자산형성 중심
                            </span>


                        </div>


                    </label>





                    <label class="profile-option">

                        <input type="checkbox" name="consumption_type" value="careful">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />

                                <path d="m9 12 2 2 4-4" />

                            </svg>


                            <span>
                                신중한 소비 중심
                            </span>


                        </div>


                    </label>


                </div>


            </section>





            <!-- ================= 중요 가치 기준 ================= -->


            <section class="profile-section">


                <div class="profile-section-title">

                    <span>
                        2
                    </span>


                    <h2>
                        중요 가치 기준
                        <small>
                            (최대 3개 선택 가능)
                        </small>
                    </h2>


                </div>



                <div class="profile-option-grid">


                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="price">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <circle cx="12" cy="12" r="10" />

                                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />

                                <path d="M12 18V6" />

                            </svg>


                            <span>
                                가격
                            </span>


                        </div>

                    </label>





                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="usage">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 2 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z" />

                            </svg>


                            <span>
                                활용도
                            </span>


                        </div>

                    </label>





                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="quality">


                        <div class="profile-option-content">

                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path
                                    d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />

                                <path d="M20 2v4" />

                                <path d="M22 4h-4" />

                                <circle cx="4" cy="20" r="2" />

                            </svg>


                            <span>
                                품질/성능
                            </span>


                        </div>


                    </label>



                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="period">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <circle cx="12" cy="12" r="10" />

                                <polyline points="12 6 12 12 16 14" />

                            </svg>


                            <span>
                                지속/유지 기간
                            </span>


                        </div>


                    </label>



                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="satisfaction">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <circle cx="12" cy="12" r="10" />

                                <path d="M8 14s1.5 2 4 2 4-2 4-2" />

                                <line x1="9" x2="9.01" y1="9" y2="9" />

                                <line x1="15" x2="15.01" y1="9" y2="9" />

                            </svg>


                            <span>
                                만족감
                            </span>


                        </div>


                    </label>



                    <label class="profile-option">

                        <input type="checkbox" name="value_type" value="efficiency">


                        <div class="profile-option-content">


                            <svg class="profile-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <path d="M12 6v6l1.56.78" />

                                <path d="M13.227 21.925a10 10 0 1 1 8.767-9.588" />

                                <path d="m14 18 4-4 4 4" />

                                <path d="M18 22v-8" />

                            </svg>


                            <span>
                                효율성
                            </span>


                        </div>


                    </label>


                </div>


            </section>

            <!-- 월 소비 가능 금액 -->

            <section class="profile-section">


                <div class="profile-section-title">

                    <span>
                        3
                    </span>


                    <h2>
                        월 소비 가능 예상 금액
                        <small>
                            (고정 지출 제외)
                        </small>
                    </h2>


                </div>




                <div class="profile-money-grid">


                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="under10">

                        <span>
                            10만원 이하
                        </span>

                    </label>




                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="10-30">

                        <span>
                            10~30만원
                        </span>

                    </label>




                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="30-50">

                        <span>
                            30~50만원
                        </span>

                    </label>




                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="50-100">

                        <span>
                            50~100만원
                        </span>

                    </label>




                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="100-200">

                        <span>
                            100~200만원
                        </span>

                    </label>




                    <label class="profile-money-option">

                        <input type="radio" name="budget" value="over200">

                        <span>
                            200만원 이상
                        </span>

                    </label>


                </div>


            </section>


                </div>

                <div class="profile-submit-area">

                    <button type="submit" class="profile-submit">

                        가입 완료

                    </button>

                </div>


            </section>

    </form>



    <script src="{% static 'js/signup_profile.js' %}"></script>
