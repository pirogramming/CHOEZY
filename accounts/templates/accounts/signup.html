{% load static %}

<link rel="stylesheet" href="{% static 'css/forms.css' %}">


<div class="signup-page">


    <!-- 로고 -->
    <div class="signup-logo">
        CHOEZY
    </div>



    <!-- 상단 영역 -->
    <div class="signup-top">


        <!-- 왼쪽 : 제목 + 캐릭터 -->
        <div class="signup-top-left">


            <div class="signup-title-area">

                <h1>
                    기본 정보를 입력해주세요
                </h1>

                <p>
                    CHOEZY를 더 안전하게 이용할 수 있어요.
                </p>

            </div>


            <img
                src="{% static 'images/signup_character.png' %}"
                class="signup-character"
                alt="signup character"
            >


        </div>




        <!-- 오른쪽 : 단계 표시 -->
        <div class="signup-top-right">


            <div class="signup-step">


                <!-- STEP 1 -->
                <div class="step-item active">


                    <div class="step-circle">
                        1
                    </div>


                    <span class="step-text">
                        기본 정보 입력
                    </span>


                </div>



                <!-- 연결선 -->
                <div class="step-item-line">

                    <div class="step-line"></div>

                </div>





                <!-- STEP 2 -->
                <div class="step-item">


                    <div class="step-circle">
                        2
                    </div>


                    <span class="step-text">
                        소비 프로필 설정
                    </span>


                </div>



            </div>


        </div>


    </div>





    <!-- 회원가입 form -->
    <form method="POST">

        {% csrf_token %}



        <!-- 입력 폼 -->
        <div class="signup-form">



            <!-- 왼쪽 입력 -->
            <div class="signup-form-left">



                <label>
                    이름
                </label>


                <div class="signup-input-box">

                    <input 
                        type="text"
                        name="name"
                    >

                </div>





                <label>
                    아이디
                </label>



                <div class="signup-inline">


                    <div class="signup-input-box">

                        <input 
                            type="text"
                            name="username"
                        >

                    </div>



                    <button 
                        type="button"
                        class="signup-check-btn"
                    >
                        중복 확인
                    </button>


                </div>


                <label>
                    이메일
                </label>


                <div class="signup-input-box">

                    <input 
                        type="email"
                        name="email"
                    >

                </div>

                <label>
                    성별
                </label>

                <div class="signup-gender">

                    <label>

                        <input 
                            type="radio"
                            name="gender"
                            value="M"
                        >

                        남성

                    </label>

                    <label>

                        <input 
                            type="radio"
                            name="gender"
                            value="F"
                        >

                        여성

                    </label>

                </div>

            </div>


            <!-- 오른쪽 입력 -->
            <div class="signup-form-right">

                <label>
                    비밀번호
                </label>


                <div class="signup-input-box">

                    <input 
                        type="password"
                        name="password"
                    >

                </div>

                <label>
                    비밀번호 확인
                </label>

                <div class="signup-input-box">

                    <input 
                        type="password"
                        name="password_confirm"
                    >

                </div>


                <label>
                    생년월일
                </label>


                <div class="signup-input-box">

                    <input 
                        type="date"
                        name="birth"
                    >

                </div>


            </div>



        </div>


        <!-- 다음 단계 버튼 -->
        <a href="{% url 'accounts:signup_profile' %}" class="signup-next-btn">
            다음 단계
        </a>


    </form>


</div>
