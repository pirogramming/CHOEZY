{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CHOEZY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=2">
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <a href="{% url 'products:consideration_create' %}" class="navbar__logo">
        <img src="{% static 'images/choezy_logo_white.png' %}">
      </a>

      <div class="navbar__right">
        <nav class="navbar__menu">
          <a href="{% url 'products:consideration_create' %}" class="navbar__link">구매 코치</a>
          <a href="{% url 'products:consumption_log' %}" class="navbar__link">소비로그</a>
          <a href="{% url 'products:choezy_report' %}" class="navbar__link">초이지 리포트</a>
          <a href="{% url 'accounts:profile' %}" class="navbar__link">마이페이지</a>
        </nav>

        <div class="navbar__user">
          <button type="button" class="navbar__bell" aria-label="알림">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C9.79 2 8 3.79 8 6V10.5C8 11.2 7.73 11.85 7.25 12.35L6 13.6C5.4 14.2 5.8 15.3 6.7 15.3H17.3C18.2 15.3 18.6 14.2 18 13.6L16.75 12.35C16.27 11.85 16 11.2 16 10.5V6C16 3.79 14.21 2 12 2Z" fill="#7FE7CE"/>
              <circle cx="12" cy="19" r="2" fill="#FFD84D"/>
            </svg>
          </button>

          {% if user.is_authenticated %}
            <span class="navbar__username">{{ user.name }}님</span>
          {% else %}
            <a href="{% url 'accounts:login' %}" class="navbar__username">로그인</a>
          {% endif %}
        </div>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}
</body>
</html>
